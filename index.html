<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEMELORD: 8-BIT EDITION</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body {
            background-color: #11121d;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100dvh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            padding: 8px;
            gap: 10px;
        }
        canvas {
            background-color: #1a1c2c;
            max-width: 100%;
            max-height: calc(100dvh - 96px);
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.25);
            touch-action: none;
        }
        .controls {
            display: flex;
            width: 100%;
            max-width: 480px;
            height: 68px;
            gap: 10px;
        }
        /* На ПК (устройства с мышью и точным курсором) скрываем кнопки и растягиваем холст */
        @media (hover: hover) and (pointer: fine) {
            .controls { display: none; }
            canvas { max-height: calc(100dvh - 16px); }
        }
        .btn {
            flex: 1;
            background: #22263a;
            border: 3px solid #ffffff;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 22px;
            font-weight: bold;
            border-radius: 6px;
            touch-action: manipulation;
            cursor: pointer;
        }
        .btn:active { background: #3b4266; transform: translateY(2px); }
        .btn-ban { background: #8e1616; border-color: #ffd740; color: #ffd740; flex: 1.3; }
        .btn-ban:active { background: #c62828; }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="480" height="720"></canvas>
    <div class="controls">
        <button class="btn" id="btnLeft">◀</button>
        <button class="btn btn-ban" id="btnBan">БАН!</button>
        <button class="btn" id="btnRight">▶</button>
    </div>
    <script src="audio.js"></script>
    <script src="ui.js"></script>
    <script src="game.js"></script>
</body>
</html>
